name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone Repositori
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node & Cache to speed up compilation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Fast dependencies clean install
      - name: Install dependencies
        run: npm ci

      # Step 4: Quality gate linter check
      - name: Run Linter
        run: npm run lint

      # Step 5: Authenticate to Docker Registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Set up Docker Buildx (caching layers)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Build standalone Next.js image and push it to registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/otonotif-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Step 0: Clone Repositori agar docker-compose.yml tersedia
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Copy docker-compose.yml to VPS
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/otonotif-app"

      # Step 2: Connect via SSH and update container on the server
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Ensure the deployment folder exists
            mkdir -p ~/otonotif-app
            
            # Navigate to the deployment folder
            cd ~/otonotif-app || exit 1
            
            # Detect whether to use 'docker compose' (v2) or 'docker-compose' (v1)
            # We use sudo as ec2-user may not have permissions for docker.sock
            if sudo docker compose version >/dev/null 2>&1; then
                COMPOSE_CMD="sudo docker compose"
            else
                COMPOSE_CMD="sudo docker-compose"
            fi
            
            echo "Using compose command: $COMPOSE_CMD"
            
            # Login to Docker Hub (if registry is private, otherwise optional)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Pull the new image built by GitHub Actions
            $COMPOSE_CMD pull
            
            # Recreate containers with the new image in background mode
            $COMPOSE_CMD up -d
            
            # Clean up old unused dangling images to free up server SSD space
            sudo docker image prune -f
            
            echo "Deployment Completed Successfully! 🚀"
