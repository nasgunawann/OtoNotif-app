services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    image: nasgunawan/otonotif-app:latest
    container_name: otonotif-web
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: always
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true
