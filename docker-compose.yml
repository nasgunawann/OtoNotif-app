services:
  db:
    image: postgres:16-alpine
    container_name: otonotif-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: otonotif
    ports:
      - "5432:5432"
    volumes:
      - otonotif-pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: dockerfile
    image: ${DOCKER_IMAGE_NAME:-nasgunawan/otonotif-app:latest}
    container_name: otonotif-web
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: always
    networks:
      - default
      - proxy-net

volumes:
  otonotif-pgdata:

networks:
  proxy-net:
    external: true
