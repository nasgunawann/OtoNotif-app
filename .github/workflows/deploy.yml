name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone Repositori
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node & Cache to speed up compilation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Fast dependencies clean install
      - name: Install dependencies
        run: npm ci

      # Step 4: Quality gate linter check
      - name: Run Linter
        run: npm run lint

      # Step 5: Authenticate to Docker Registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Set up Docker Buildx (caching layers)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Build standalone Next.js image and push it to registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/otonotif-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Step 1: Connect via SSH and update container on the server
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to the deployment folder
            cd /var/www/otonotif-app || exit 1
            
            # Login to Docker Hub (if registry is private, otherwise optional)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Pull the new image built by GitHub Actions
            docker compose pull
            
            # Recreate containers with the new image in background mode
            docker compose up -d
            
            # Clean up old unused dangling images to free up server SSD space
            docker image prune -f
            
            echo "Deployment Completed Successfully! 🚀"
