name: CI/CD Pipeline for OtoNotif

on:
  push:
    branches:
      - main

env:
  # Sets the image name template using your Docker Hub username dynamically
  # E.g., username/otonotif-app
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/otonotif-app

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Step 0: Clone Repositori agar docker-compose.yml tersedia
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Copy docker-compose.yml to VPS
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/otonotif-app"

      # Step 2: Connect via SSH and update container on the server
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Ensure the deployment folder exists
            mkdir -p ~/otonotif-app
            
            # Navigate to the deployment folder
            cd ~/otonotif-app || exit 1
            
            # Detect whether to use 'docker compose' (v2) or 'docker-compose' (v1)
            # We use sudo as ec2-user may not have permissions for docker.sock
            if sudo docker compose version >/dev/null 2>&1; then
                COMPOSE_CMD="sudo docker compose"
            else
                COMPOSE_CMD="sudo docker-compose"
            fi
            
            echo "Using compose command: $COMPOSE_CMD"
            
            # Login to Docker Hub (if registry is private, otherwise optional)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Pull the new image built by GitHub Actions
            $COMPOSE_CMD pull
            
            # Recreate containers with the new image in background mode
            $COMPOSE_CMD up -d
            
            # Clean up old unused dangling images to free up server SSD space
            sudo docker image prune -f
            
            echo "Deployment Completed Successfully! 🚀"
